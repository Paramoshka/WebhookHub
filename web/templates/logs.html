{{template "partials.html" .}}

<div class="pagination" style="margin-top: 18px; display: flex; align-items: center; gap: 12px;">
  <a href="{{.PrevURL}}" hx-get="{{.PrevURL}}" hx-target="#webhooks-table" hx-swap="innerHTML" class="nav-link {{if .DisablePrev}}is-disabled{{end}}">Prev</a>
  <span>Page {{.CurrentPage}}</span>
  <a href="{{.NextURL}}" hx-get="{{.NextURL}}" hx-target="#webhooks-table" hx-swap="innerHTML" class="nav-link {{if .DisableNext}}is-disabled{{end}}">Next</a>
</div>
