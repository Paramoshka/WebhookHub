<div id="webhooks-table" hx-get="{{.CurrentURL}}" hx-trigger="every 5s" hx-swap="outerHTML" hx-sync="#filter-form:drop">
{{template "partials.html" .}}

<div class="pagination" style="margin-top: 18px; display: flex; align-items: center; gap: 12px;">
  {{if .DisablePrev}}
  <span class="nav-link is-disabled" aria-disabled="true">Prev</span>
  {{else}}
  <a href="{{.PrevPageURL}}" hx-get="{{.PrevURL}}" hx-headers='{"X-Update-History":"true"}' hx-target="#webhooks-table" hx-swap="outerHTML" hx-sync="#filter-form:replace" class="nav-link">Prev</a>
  {{end}}
  <span>Page {{.CurrentPage}}</span>
  {{if .DisableNext}}
  <span class="nav-link is-disabled" aria-disabled="true">Next</span>
  {{else}}
  <a href="{{.NextPageURL}}" hx-get="{{.NextURL}}" hx-headers='{"X-Update-History":"true"}' hx-target="#webhooks-table" hx-swap="outerHTML" hx-sync="#filter-form:replace" class="nav-link">Next</a>
  {{end}}
</div>
</div>
