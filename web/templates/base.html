{{define "base"}}
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{block "title" .}}WebhookHub{{end}}</title>
  <script src="/static/htmx.min.js"></script>
  <script src="/static/timezone.js" defer></script>
  <script src="/static/timezone-picker.js" defer></script>
  <script src="/static/date-picker.js" defer></script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="navbar">
  <div class="brand-group">
    <a href="/" hx-boost="true" class="brand-mark">WH</a>
    <div>
      <a href="/" hx-boost="true" class="brand-name">WebhookHub</a>
      <div class="brand-subtitle">Receive, inspect and deliver webhooks with full traceability.</div>
    </div>
  </div>

  <nav class="nav-links" aria-label="Primary">
    <a href="/" hx-boost="true" class="nav-link">Home</a>
    <a href="/dashboard" hx-boost="true" class="nav-link">Webhook Logs</a>
    <a href="/dlq" hx-boost="true" class="nav-link">DLQ</a>
    <a href="/forwarding" hx-boost="true" class="nav-link">Forwarding Rules</a>
  </nav>

  <div class="timezone-control">
    <label id="timezone-label" for="timezone-select">Timezone</label>
    <select id="timezone-select" aria-describedby="timezone-current" disabled>
      <option value="UTC">UTC</option>
    </select>
    <button id="timezone-picker" class="timezone-picker" type="button" aria-haspopup="dialog" aria-controls="timezone-popup" aria-expanded="false" aria-labelledby="timezone-label timezone-choice" aria-describedby="timezone-current" hidden><span id="timezone-choice">UTC</span></button>
    <span id="timezone-current" class="timezone-current" aria-live="polite">UTC</span>
    <div id="timezone-popup" class="timezone-popup" popover="auto" role="dialog" aria-label="Choose timezone">
      <input id="timezone-search" type="search" role="combobox" aria-label="Search timezones" placeholder="Search city or timezone…" autocomplete="off" spellcheck="false" aria-autocomplete="list" aria-controls="timezone-options" aria-expanded="false">
      <ul id="timezone-options" class="timezone-options" role="listbox" aria-label="Timezones"></ul>
      <p id="timezone-empty" class="timezone-empty" role="status" hidden>No matching timezones. Try a city or region.</p>
    </div>
  </div>

  <form action="/logout" method="POST">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
    <button class="btn-secondary" type="submit">Logout</button>
  </form>
</header>

<main class="container">
  {{block "content" .}}{{end}}
</main>
</body>
</html>
{{end}}
