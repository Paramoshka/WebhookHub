name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: webhookhub_test
          POSTGRES_USER: webhookhub
          POSTGRES_PASSWORD: webhookhub_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U webhookhub -d webhookhub_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_POSTGRES_HOST: localhost
      TEST_POSTGRES_PORT: "5432"
      TEST_POSTGRES_USER: webhookhub
      TEST_POSTGRES_PASSWORD: webhookhub_test_password
      TEST_POSTGRES_DB: webhookhub_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - run: go test -race ./...
      - run: go vet ./...
      - run: CGO_ENABLED=0 go build -trimpath -o "${RUNNER_TEMP}/webhookhub" ./cmd/webhookhub
      - run: docker build --tag webhookhub:test .
